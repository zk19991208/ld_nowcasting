# DiffCast — Residual Diffusion for Precipitation Nowcasting
# Paper: https://arxiv.org/abs/2312.06734 (CVPR 2024)
# Faithful reimplementation: SimVP backbone + GTUNet diffusion

data:
  data_root: /liyang/data/NJU_CPOL
  index_dir: ./index
  variables: [dBZ]
  n_input_frames: 10
  n_output_frames: 20
  batch_size: 1           # per GPU — 1 × 8 GPUs = 8 total (32 GiB/GPU)
  num_workers: 4

model:
  type: diffcast
  diffcast:
    spatial_size: 256
    dim: 64
    dim_mults: [1, 2, 4, 8]
    diffusion_timesteps: 1000
    sampling_timesteps: 250
    objective: pred_v       # v-prediction (same as paper)
    loss_alpha: 0.5         # balance: 0.5·L_diff + 0.5·L_backbone
    # SimVP backbone (from paper)
    simvp_hid_S: 64
    simvp_hid_T: 256
    simvp_N_S: 2
    simvp_N_T: 6

loss:
  use_diffcast_loss: true
  components:
    mse: {weight: 1.0}

train:
  max_epochs: 500
  lr: 0.00005
  weight_decay: 0.0
  optimizer: adamw
  scheduler:
    type: cosine
  early_stopping_patience: 50
  gradient_clip_val: 1.0
  precision: "bf16-mixed"

eval:
  thresholds_dbz: [20, 35, 40]
  per_leadtime: false

vis:
  enabled: true
  train_every_n_steps: 200
  val_every_n_steps: 0
  every_n_epochs: 1
  display_lead_minutes: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78, 84, 90, 96, 102, 108, 114, 120]
  save_dir: vis_output

logging:
  use_tensorboard: true
  use_wandb: false
