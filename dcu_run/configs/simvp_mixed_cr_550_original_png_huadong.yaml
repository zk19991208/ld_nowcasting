# SimVP + 新疆/华东混合训练：多列 PNG CSV 由 preprocess/mixed_cr_6min/build_mixed_train_csv.py 生成。
# train：合并列表 data_list_train_mixed.csv（列路径含 xinjiang/...、huadong/... 前缀）。
# val/test：默认仅新疆（mixed 目录下 data_list_val.csv / data_list_test.csv），与统一 radar_dir 一致。
#
# 用法（在 transfer/ascend_run 下）：
#   python run_train_yaml.py --config configs/simvp_mixed_cr_550_original_png.yaml
# 请将 radar_dir 改为服务器上统一数据根（其下须有 xinjiang/CR_6min_550x550 与 huadong/CR_6min_550x550）。
#
# 载入 finetune 权重并冻结 Encoder：
#   weight_path: /path/to/finetune.ckpt
#   freeze_encoder: true

launcher: python

accelerator: gpu
# 方法二：指定物理卡 0–7（共 8 块），勿写 devices，否则会覆盖 gpus。
gpus: "0,1,2,3,4,5,6,7"

model_name: simvp
dataset_name: SingleRadarDataModule

height: 560
width: 560
input_length: 20
target_length: 20
downscale_factor: 16

train_file: ./preprocess/mixed_cr_6min/data_list_train_mixed_new.csv
val_file: ./preprocess/mixed_cr_6min/data_list_val.csv
test_file: ./preprocess/mixed_cr_6min/data_list_test.csv

# 统一根目录：下面挂 xinjiang/CR_6min_550x550 与 huadong/CR_6min_550x550（与 CSV 列相对路径拼接）
radar_dir: ./data

packed_sequence_file: 0
packed_event_npy: 0

val_sample_interval: 1

input_class:
  - 1
predict_class:
  - 1
predict_class_vmax:
  - 70

loss_fx: l1
learning_rate: 0.0001

hid_S: 32
hid_T: 128
N_S: 4
N_T: 3
groups: 8
incep_ker:
  - 3
  - 5
  - 7
  - 11

batch_size: 4
num_workers: 4
pin_memory: 1

add_video: 0
early_stopping_on: 0

train_log_steps: 200
val_log_steps: 10

tensorboard_save_path: log
tensorboard_exp_name: simvp_mixed_cr550_png_huadong

save_dirpath: save/simvp_mixed_cr550_png_huadong
save_monitor: CSI_35dBZ_val
save_filename: "weights-{epoch:03d}-{CSI_35dBZ_val:.3f}"
save_top_k: 10
save_mode: max

max_epochs: 50
check_val_rate: 0.5
refresh_rate: 20

# 预训练 / finetune 起点 ckpt；不用则保持 null
weight_path: null
resume_path: ""

# 1 或 true：冻结对应子模块（仅训练未冻部分）；通常配合 weight_path 只开 freeze_encoder
freeze_encoder: 0
freeze_mid: 0
freeze_decoder: 0

# 频域辅助损失：0 表示关闭（与旧行为一致）
freq_loss_weight: 0
freq_loss_alpha: 1.0
freq_loss_scales:
  - 1
  - 2
  - 4
  